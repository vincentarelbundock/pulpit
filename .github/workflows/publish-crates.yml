name: Publish to crates.io

# Fires on a *final* release tag. `release.yml` runs independently from the
# same push, so binary artifacts and crates.io publishing are not coupled.
#
# The pattern deliberately has no trailing wildcard, which `release.yml`'s
# does: a prerelease tag like `v0.2.0-rc1` builds and publishes artifacts and
# updates the Homebrew cask, but must never reach crates.io. A published
# version there can be yanked but never deleted or reused, so a rehearsal that
# burned `0.2.0` would cost the real release its version number.
#
# Order matters: a crate cannot be published before the crates it depends on
# are on the registry, so the workspace is published bottom-up.
#
# Required secrets:
#   CARGO_REGISTRY_TOKEN   crates.io token with publish rights.

on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # A tag is not a test. v0.0.6 was tagged from a tree whose macOS binary
  # could not link and whose Windows binary did not compile, and it published
  # anyway, because a tag push was the only thing either workflow waited for.
  # Every job below now waits for CI to have passed on this exact commit.
  gate:
    name: CI is green for this commit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require a successful CI run for ${{ github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The tagged commit is normally already on main, so its CI run
          # either exists or is starting; wait rather than race it.
          for attempt in $(seq 1 80); do
            run="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&per_page=1" \
              --jq '.workflow_runs[0] | "\(.status) \(.conclusion)"' 2>/dev/null || echo "missing none")"
            status="${run%% *}"
            conclusion="${run##* }"
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "CI passed for ${GITHUB_SHA}."
                exit 0
              fi
              echo "::error::CI concluded '${conclusion}' for ${GITHUB_SHA}; refusing to release a commit that does not build."
              exit 1
            fi
            echo "CI is '${status}' for ${GITHUB_SHA} (attempt ${attempt}/80); waiting."
            sleep 30
          done
          echo "::error::timed out waiting for CI to finish on ${GITHUB_SHA}."
          exit 1

  publish:
    name: cargo publish
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxkbcommon-dev \
            libwayland-dev libdbus-1-dev pkg-config

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -eu
          for crate in pulpit-core pulpit-display pulpit-render pulpit-media pulpit; do
            cargo publish -p "$crate" --locked --token "${CARGO_REGISTRY_TOKEN}"
          done

      # rust-cache's post step walks `target/` and trips over the transient
      # package/verify trees `cargo publish` leaves behind, failing the job
      # after every crate has already been uploaded.
      - name: Remove packaging debris before the cache post step
        if: always()
        run: rm -rf target/package
