name: Release

# Fires on a version tag pushed by `make release`.
#
# Pulpit is deliberately *not* released as a bare binary. winit, wgpu and
# PDFium are all dlopen'd at run time, so a naked executable starts on one
# machine and fails on the next; `scripts/make-bundle.sh` produces a
# relocatable directory carrying libpdfium and a launcher that sets the loader
# path. That bundle, not the executable, is the artifact.
#
# `.deb` and `.rpm` are the *primary* Linux deliverable (SPEC-package.md §5.1):
# only a native package can declare the dlopen set as dependencies and a
# Chromium-family browser as a recommendation. Both are generated from one
# description, packaging/linux/nfpm.yaml, rather than maintained twice.

on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write
  actions: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # A tag is not a test. v0.0.6 was tagged from a tree whose macOS binary
  # could not link and whose Windows binary did not compile, and it published
  # anyway, because a tag push was the only thing either workflow waited for.
  # Every job below now waits for CI to have passed on this exact commit.
  gate:
    name: CI is green for this commit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require a successful CI run for ${{ github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The tagged commit is normally already on main, so its CI run
          # either exists or is starting; wait rather than race it.
          for attempt in $(seq 1 80); do
            run="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&per_page=1" \
              --jq '.workflow_runs[0] | "\(.status) \(.conclusion)"' 2>/dev/null || echo "missing none")"
            status="${run%% *}"
            conclusion="${run##* }"
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "CI passed for ${GITHUB_SHA}."
                exit 0
              fi
              echo "::error::CI concluded '${conclusion}' for ${GITHUB_SHA}; refusing to release a commit that does not build."
              exit 1
            fi
            echo "CI is '${status}' for ${GITHUB_SHA} (attempt ${attempt}/80); waiting."
            sleep 30
          done
          echo "::error::timed out waiting for CI to finish on ${GITHUB_SHA}."
          exit 1

  bundle:
    needs: gate
    name: Linux x86_64 packages
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxkbcommon-dev \
            libwayland-dev libdbus-1-dev pkg-config

      # Fetches the pinned, hash-verified PDFium and stages it beside the
      # binary. A hash mismatch fails the release rather than shipping an
      # unverified library.
      - name: Build the bundle
        run: make bundle

      - name: Archive
        id: archive
        run: |
          set -eu
          # make-bundle.sh writes both the directory and its tarball, named
          # from the manifest version and the machine architecture.
          archive="$(ls dist/pulpit-*.tar.gz)"
          sha256sum "${archive}" > "${archive}.sha256"
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"

      # Pinned deliberately, like every other dependency here: the version is
      # updated by editing this file, never resolved at build time. The hash is
      # checked so a replaced asset fails the release instead of building the
      # packages with an unverified tool.
      - name: Install nfpm
        env:
          NFPM_VERSION: 2.47.0
          NFPM_SHA256: 0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783
        run: |
          set -eu
          url="https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSL -o /tmp/nfpm.tar.gz "$url"
          echo "${NFPM_SHA256}  /tmp/nfpm.tar.gz" | sha256sum -c -
          tar -xzf /tmp/nfpm.tar.gz -C /tmp nfpm
          sudo install -m755 /tmp/nfpm /usr/local/bin/nfpm

      # The primary Linux deliverable. `bundle` already built the binary and
      # fetched the pinned PDFium, so this only lays them out and describes
      # the dependencies.
      - name: Build the .deb and .rpm
        run: make linux-packages

      - name: Checksums
        run: |
          set -eu
          cd dist
          for artifact in *.deb *.rpm *.pkg.tar.zst; do
            sha256sum "$artifact" > "$artifact.sha256"
          done
          ls -l

      # The AUR PKGBUILD, rendered from the template against the tarball
      # actually published. Publishing it needs an AUR account and an SSH key,
      # which CI does not have, so it ships as a release asset for the
      # maintainer to push — the same position winget and Scoop are in.
      - name: Render the AUR PKGBUILD
        run: |
          set -eu
          version="$(awk -F'"' '/^version/ { print $2; exit }' Cargo.toml)"
          checksum="$(cut -d' ' -f1 < "${{ steps.archive.outputs.archive }}.sha256")"
          sed -e "s/__VERSION__/${version}/g" -e "s/__SHA256__/${checksum}/g" \
            packaging/linux/PKGBUILD.in > dist/PKGBUILD
          cat dist/PKGBUILD

      # Proves the package is installable and that the installed binary finds
      # its PDFium with no wrapper and no environment variable — the whole
      # point of the layout in §1.
      - name: Install the .deb and run it
        run: |
          set -eu
          sudo apt-get install -y ./dist/*.deb
          pulpit --version
          test -f /usr/lib/pulpit/libpdfium.so
          test -f /usr/share/applications/pulpit.desktop
          sudo apt-get remove -y pulpit

      - uses: softprops/action-gh-release@v2
        with:
          # A tag with a hyphen is a rehearsal: publish the artifacts, but
          # never let it show as the latest release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            ${{ steps.archive.outputs.archive }}
            ${{ steps.archive.outputs.archive }}.sha256
            dist/*.deb
            dist/*.deb.sha256
            dist/*.rpm
            dist/*.rpm.sha256
            dist/*.pkg.tar.zst
            dist/*.pkg.tar.zst.sha256
            dist/PKGBUILD
          body: |
            See CHANGELOG.md.

            On Debian or Ubuntu install the `.deb`, on Fedora or openSUSE the
            `.rpm`, and on Arch the `.pkg.tar.zst`. They are the supported
            Linux packages: they pull in the graphics libraries pulpit loads at
            run time, carry the pinned libpdfium, and install the desktop entry
            and icon.

            The `.deb` and `.rpm` additionally *recommend* a Chromium-family
            browser, which is what renders media overlays. The Arch package
            cannot say so — the tooling emits no `optdepend` — so install
            `chromium` alongside it, or use the AUR `pulpit-bin`, whose
            PKGBUILD carries the optional dependency.

            The tarball is a relocatable directory: unpack it and run
            `pulpit/pulpit deck.pdf`. It carries its own libpdfium. The usual
            desktop libraries (`libxcursor`, `libxkbcommon`, a Vulkan loader)
            must be present on the machine; Pulpit says which ones are missing
            rather than crashing.

            On NixOS, use the flake instead: `nix profile add .`

  macos:
    needs: gate
    name: macOS universal app
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # `make app-universal` fetches both pinned PDFium artifacts, builds the
      # binary for both Apple architectures, `lipo`s each Mach-O, lays out
      # `Pulpit.app` and ad-hoc signs it. A hash mismatch on PDFium fails the
      # release rather than shipping an unverified library, and a bundle that
      # lost an architecture slice fails it rather than reaching an Intel Mac
      # as a silently broken app.
      - name: Build and sign the universal app bundle
        run: make app-universal

      # The disk image is the shape a Homebrew Cask expects and the shape a
      # human expects from a download: mount, drag onto Applications.
      - name: Disk image
        id: dmg
        run: |
          set -eu
          version="$(awk -F'"' '/^version/ { print $2; exit }' Cargo.toml)"
          staging="$(mktemp -d)"
          cp -R dist/Pulpit.app "$staging/"
          ln -s /Applications "$staging/Applications"
          dmg="dist/pulpit-${version}-macos-universal.dmg"
          hdiutil create -volname Pulpit -srcfolder "$staging" \
            -ov -format UDZO "$dmg"
          shasum -a 256 "$dmg" > "$dmg.sha256"
          echo "dmg=${dmg}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          # A tag with a hyphen is a rehearsal: publish the artifacts, but
          # never let it show as the latest release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            ${{ steps.dmg.outputs.dmg }}
            ${{ steps.dmg.outputs.dmg }}.sha256
          body: |
            See CHANGELOG.md.

            The disk image carries `Pulpit.app`, which bundles its own
            libpdfium. Drag it onto Applications. The binary and the bundled
            libpdfium are both universal, so one download runs natively on
            Apple Silicon and on Intel.

            Media overlays need a Chromium-family browser — Google Chrome,
            Chromium, Edge or Brave in `/Applications` — and `brew install
            mpv` additionally plays video and animated images without a
            browser in the loop. Neither is bundled; a deck with no media
            needs neither.

            The app is **ad-hoc signed, not notarized**. Notarization needs a
            paid Developer ID and no release is gated on one
            (SPEC-package.md §7). A first launch therefore goes through
            System Settings → Privacy & Security → Open Anyway, once, whether
            the app came from the disk image or from the Homebrew Cask.

            macOS 11 Big Sur or newer, on either architecture.

      # Update the Homebrew Cask, so `brew install --cask` works off this tag
      # without a hand edit. Conditional on the token for the same reason the
      # Windows signing step is conditional: a tag pushed without it must
      # still produce a complete release, and a fork must stay green.
      #
      # The cask is rendered from packaging/macos/pulpit.rb.in — the tap's
      # copy is generated output, and a hand edit there is overwritten here.
      # `secrets` is not an available context in a step-level `if`, so the
      # presence of the token is turned into an output first.
      - name: Is the tap configured?
        id: tap
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          # A prerelease tag — v0.2.0-rc1 — exists to rehearse this workflow.
          # It must build and upload everything, so that the rehearsal is
          # worth something, and must not become what `brew install` hands a
          # user. The tap always describes the current *release*.
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${GITHUB_REF_NAME} is a prerelease; leaving the cask alone."
          elif [ -n "${TOKEN:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::HOMEBREW_TAP_GITHUB_TOKEN is not set; skipping the cask."
          fi

      - name: Update the Homebrew tap
        if: steps.tap.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          set -eu
          version="$(awk -F'"' '/^version/ { print $2; exit }' Cargo.toml)"
          dmg="dist/pulpit-${version}-macos-universal.dmg"
          # The hash of the artifact actually published, read back from the
          # file just uploaded rather than recomputed from a rebuild.
          checksum="$(shasum -a 256 "$dmg" | cut -d' ' -f1)"

          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/vincentarelbundock/homebrew-tap.git" \
            "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Casks"
          sed -e "s/__VERSION__/${version}/g" -e "s/__SHA256__/${checksum}/g" \
            packaging/macos/pulpit.rb.in > "$RUNNER_TEMP/tap/Casks/pulpit.rb"

          cd "$RUNNER_TEMP/tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage first, then compare against the index: on the release that
          # creates Casks/pulpit.rb the file is untracked, and a plain
          # `git diff` does not see untracked files. That reported "already
          # at ${version}" and pushed nothing, so the tap had no cask at all.
          git add Casks/pulpit.rb
          if git diff --cached --quiet; then
            echo "::notice::the cask is already at ${version}"
            exit 0
          fi
          git commit -m "pulpit ${version}"
          git push

          # Verify the tap from the outside, the way `brew` will read it, so
          # that a push which succeeds locally but leaves the tap without a
          # usable cask fails the release rather than passing quietly. The
          # placeholder check catches a renamed token in the template; the
          # fetch catches a push to the wrong branch or repository.
          if grep -q '__VERSION__\|__SHA256__' Casks/pulpit.rb; then
            echo "::error::the cask still holds unsubstituted placeholders"
            exit 1
          fi
          # The API, not raw.githubusercontent.com: raw is served through a
          # CDN that can hold a stale copy for minutes after a push, which
          # would make this check flaky rather than meaningful.
          api="https://api.github.com/repos/vincentarelbundock/homebrew-tap/contents/Casks/pulpit.rb?ref=main"
          published="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.raw" "$api" || true)"
          if ! printf '%s' "$published" | grep -q "version \"${version}\""; then
            echo "::error::the tap does not serve Casks/pulpit.rb at ${version}"
            exit 1
          fi
          echo "::notice::the tap serves pulpit ${version}"

  windows:
    needs: gate
    name: Windows x64 package
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Fetches the pinned, hash-verified PDFium, builds the binary with its
      # icon and version block embedded, and produces both the portable zip
      # Scoop installs from and the per-user installer winget runs.
      - name: Build the package
        run: make windows

      # Signing is deliberately conditional. A certificate is a *quality*
      # improvement and no release may be gated on possessing one
      # (SPEC-package.md §6.1), so a tag pushed without the secret configured
      # still produces a complete, publishable release — winget wants a
      # checksum, Scoop wants nothing.
      #
      # SignPath's Foundation tier signs open-source projects for free. This
      # needs a SignPath project, and the slugs below must match it.
      - name: Is signing configured?
        id: signing
        env:
          TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if [ -n "${TOKEN:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SIGNPATH_API_TOKEN is not set; publishing unsigned."
          fi

      - name: Upload the installer for signing
        if: steps.signing.outputs.enabled == 'true'
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: pulpit-installer-unsigned
          path: dist/pulpit-*-windows-x64-setup.exe

      - name: Sign
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: pulpit
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist-signed

      - name: Take the signed installer
        if: steps.signing.outputs.enabled == 'true'
        run: cp dist-signed/*.exe dist/

      # Checksums come *after* signing, never before: a signature changes the
      # bytes, and winget verifies the hash of the file it actually downloads.
      - name: Checksums
        run: |
          set -eu
          cd dist
          for artifact in pulpit-*-windows-x64.zip pulpit-*-windows-x64-setup.exe; do
            sha256sum "$artifact" > "$artifact.sha256"
          done
          ls -l

      - uses: softprops/action-gh-release@v2
        with:
          # A tag with a hyphen is a rehearsal: publish the artifacts, but
          # never let it show as the latest release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/pulpit-*-windows-x64.zip
            dist/pulpit-*-windows-x64.zip.sha256
            dist/pulpit-*-windows-x64-setup.exe
            dist/pulpit-*-windows-x64-setup.exe.sha256
          body: |
            See CHANGELOG.md.

            Two artifacts, because there are two channels. The `.zip` is what
            Scoop installs from and needs no installer and no signature. The
            `-setup.exe` is a **per-user** installer — it writes under
            `%LOCALAPPDATA%`, raises no UAC prompt, and is what winget runs.

            Both carry `pdfium.dll` beside `pulpit.exe`. The graphics stack
            ships with Windows, and media overlays use the preinstalled Edge,
            so there is nothing else to install.

            Installing through a package manager avoids the browser-download
            path that produces the loudest SmartScreen warning.

            x64 only for now; arm64 Windows runs it under emulation.
