[workspace]
resolver = "2"
members = [
    "crates/pulpit-core",
    "crates/pulpit-display",
    "crates/pulpit-media",
    "crates/pulpit-render",
    "crates/pulpit-render/fuzz",
    "crates/pulpit-testkit",
    "crates/pulpit",
]
# `cargo run` at the workspace root means the application. The other two
# binaries — the render worker and the topology capture tool — are asked for
# by name.
default-members = ["crates/pulpit"]

[workspace.package]
version = "0.0.5"
edition = "2021"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vincentarelbundock/pulpit"

[workspace.dependencies]
pulpit-core = { path = "crates/pulpit-core", version = "0.0.5" }
pulpit-display = { path = "crates/pulpit-display", version = "0.0.5", default-features = false }
# Default features on purpose: the browser worker is the only media runtime,
# so a dependant that quietly opted out would ship an application whose media
# silently never plays — which happened once already, from the other end.
pulpit-media = { path = "crates/pulpit-media", version = "0.0.5" }
pulpit-render = { path = "crates/pulpit-render", version = "0.0.5", default-features = false }
pulpit-testkit = { path = "crates/pulpit-testkit", version = "0.0.5" }

anyhow = "1"
bincode = { version = "1.3", default-features = false }
crc32fast = "1"
iced = "0.14"
memmap2 = "0.9"
notify = "8"
regex = "1"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
typst = "=0.15.1"
typst-assets = { version = "=0.15.1", features = ["fonts"] }
typst-layout = "=0.15.1"
typst-render = "=0.15.1"
typst-svg = "=0.15.1"
smithay-client-toolkit = { version = "0.21", default-features = false }
wayland-client = "0.31"
x11rb = "0.14"
# Embeds the icon and version block into pulpit.exe. Windows-only, and only
# ever a build dependency.
winresource = "0.1"
zbus = { version = "5", features = ["blocking"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

# Cryptographic signing (SPEC-signing.md §22.3, v1 scope)
cms = { version = "0.2", features = ["std"] }
x509-cert = "0.2"
der = "0.7"
rsa = "0.9"
p256 = "0.13"
p384 = "0.13"
p521 = "0.13"
ed25519-dalek = { version = "2", features = ["pkcs8", "rand_core"] }
sha2 = { version = "0.10", features = ["oid"] }
# SHA-1 is never offered for signing; it is accepted on read with a weak-
# algorithm finding (SPEC-signing.md §26.2), and reading it needs a verifier.
sha1 = { version = "0.10", features = ["oid"] }
spki = "0.7"
pkcs8 = "0.10"
pkcs12 = "0.1"
zeroize = "1"
signature = "2"
ecdsa = "0.16"
hex = "0.4"

[profile.release]
debug = 1
