ShortDescription: A PDF presenter built around connecting and disconnecting displays.
Description: |-
  Pulpit opens a presenter window on the operator's display and an audience
  window on the projector. Connection, disconnection, mirroring, swapping,
  suspend/resume and mixed DPI are treated as the main engineering problem
  rather than as polish: the audience frame is never worse than it was, and
  rendering happens in supervised worker processes.
