[package]
name = "pulpit-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "PDF rendering backends, worker processes and frame cache for pulpit."
# The test corpus and its fixture builder are development-only, and the crate
# we upload has no business carrying them: `tests/testkit` is where they live
# and `examples/dump-corpus.rs` is the one thing that reads it, so the two are
# excluded together.
exclude = ["tests/", "examples/dump-corpus.rs"]

[[bin]]
name = "pulpit-render-worker"
path = "src/bin/worker.rs"

[features]
default = ["pdfium", "p12-keystore", "djvu"]
# PDFium is loaded dynamically at run time; the binary is not linked in, so a
# build without libpdfium present still succeeds and falls back with a clear
# diagnostic (see `scripts/fetch-pdfium.sh`).
pdfium = ["dep:pdfium-render"]
# DjVu is loaded at run time through the system loader and is never bundled
# (SPEC-reader-formats.md §55.3, §65.1), so this feature adds no build-time
# native dependency — only the `dlopen` wrapper. It is on by default because
# §55.4 makes DjVu a capability of the machine, not of the build.
djvu = ["dep:libloading"]
# p12-keystore provides PKCS#12 loading and decryption
p12-keystore = ["dep:p12-keystore"]

[dependencies]
pulpit-core = { workspace = true }
pdfium-render = { version = "0.9", optional = true }
bincode = { workspace = true }
memmap2 = { workspace = true }
# Already in the dependency graph via `zip`; used here to inflate xref streams
# and object streams during signature verification.
flate2 = "1"
image = { workspace = true }
libloading = { workspace = true, optional = true }
serde = { workspace = true }
tar = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zip = { workspace = true }

# Cryptographic signing
cms = { workspace = true }
x509-cert = { workspace = true, features = ["builder"] }
der = { workspace = true }
rsa = { workspace = true }
p256 = { workspace = true }
p384 = { workspace = true }
p521 = { workspace = true }
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
sha1 = { workspace = true }
spki = { workspace = true }
pkcs8 = { workspace = true }
zeroize = { workspace = true }
signature = { workspace = true }
ecdsa = { workspace = true }
hex = { workspace = true }
p12-keystore = { version = "0.3.1", optional = true }
rand = "0.8"

[dev-dependencies]
tempfile = { workspace = true }
rcgen = "0.12"
# Fixtures hand-build object streams and xref streams, which real producers
# always deflate; a fixture that could only write them uncompressed would not
# exercise the filter and predictor paths the reader has to survive.
flate2 = "1"
