[package]
name = "pulpit-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "PDF rendering backends, worker processes and frame cache for pulpit."

[[bin]]
name = "pulpit-render-worker"
path = "src/bin/worker.rs"

[features]
default = ["pdfium"]
# PDFium is loaded dynamically at run time; the binary is not linked in, so a
# build without libpdfium present still succeeds and falls back with a clear
# diagnostic (see `scripts/fetch-pdfium.sh`).
pdfium = ["dep:pdfium-render"]

[dependencies]
pulpit-core = { workspace = true }
pdfium-render = { version = "0.9", optional = true }
bincode = { workspace = true }
memmap2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zip = { workspace = true }
# Cryptographic signing
sha2 = { version = "0.10", features = ["oid"] }
cms = { version = "0.2", features = ["std"] }
x509-cert = { version = "0.2", features = ["builder"] }
der = { version = "0.7", features = ["alloc", "derive"] }
rsa = "0.9"
p256 = "0.13"
p384 = "0.13"
p521 = "0.13"
ed25519-dalek = { version = "2", features = ["pkcs8", "rand_core"] }
pkcs8 = "0.10"
pkcs12 = "0.1"
zeroize = "1.7"
signature = "2.2"
rand = "0.8"
hex = "0.4"
rcgen = "0.12"

[dev-dependencies]
pulpit-testkit = { workspace = true }
tempfile = { workspace = true }
