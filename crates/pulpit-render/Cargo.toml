[package]
name = "pulpit-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "PDF rendering backends, worker processes and frame cache for pulpit."

[[bin]]
name = "pulpit-render-worker"
path = "src/bin/worker.rs"

[features]
default = ["pdfium", "p12-keystore"]
# PDFium is loaded dynamically at run time; the binary is not linked in, so a
# build without libpdfium present still succeeds and falls back with a clear
# diagnostic (see `scripts/fetch-pdfium.sh`).
pdfium = ["dep:pdfium-render"]
# p12-keystore provides PKCS#12 loading and decryption
p12-keystore = ["dep:p12-keystore"]

[dependencies]
pulpit-core = { workspace = true }
pdfium-render = { version = "0.9", optional = true }
bincode = { workspace = true }
memmap2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zip = { workspace = true }

# Cryptographic signing
cms = { workspace = true }
x509-cert = { workspace = true }
der = { workspace = true }
rsa = { workspace = true }
p256 = { workspace = true }
p384 = { workspace = true }
p521 = { workspace = true }
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
spki = { workspace = true }
pkcs8 = { workspace = true }
pkcs12 = { workspace = true }
zeroize = { workspace = true }
signature = { workspace = true }
ecdsa = { workspace = true }
hex = { workspace = true }
p12-keystore = { version = "0.3.1", optional = true }

[dev-dependencies]
pulpit-testkit = { workspace = true }
tempfile = { workspace = true }
rcgen = "0.12"
rand = "0.8"
