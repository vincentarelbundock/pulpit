[package]
name = "pulpit-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Media and interactive overlays for pulpit, driven over CDP."
# `tests/support` is a scripted worker used only by the supervisor's own test
# suite (§76.8); the published crate has no business carrying it.
exclude = ["tests/support"]

# No *runtime* binaries here on purpose.
#
# The browser runtime links nothing optional — it only ever *launches* an
# installed browser — so it lives in `worker/` and runs inside the
# application's own executable, re-executed with a flag: the same arrangement
# the renderer worker uses, and the reason a media worker can never be missing
# from a build or a package.
#
# A runtime that linked an optional system library (WebKitGTK) would need its
# own executable, so that one absent shared library could not stop the
# application from starting (`docs-src/internals.typ`). None currently does.
# The one `[[bin]]` below is not a runtime: it is a scripted stand-in worker
# used only by this crate's own tests, excluded from the published package.

[[bin]]
name = "pulpit-media-scripted-worker"
path = "tests/support/scripted_worker.rs"

[features]
default = ["chromium-runtime"]
# Drives an *externally installed* Chromium-family browser over CDP. Ships no
# engine; the dependency is a JPEG decoder for screencast frames.
chromium-runtime = ["dep:image"]

[dependencies]
pulpit-core = { workspace = true }

bincode = { workspace = true }
libc = { workspace = true }
# libmpv is discovered and dlopened at runtime, never linked: the same
# ships-no-engine policy as the browser and PDFium.
libloading = "0.8"
memmap2 = { workspace = true }
serde = { workspace = true }
# No longer optional: CDP needs it when the browser runtime is on, and the
# speech voice catalog needs it always. A feature that gates a dependency two
# things need is a feature that only ever fails to build.
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
getrandom = "0.2"

image = { version = "0.25", optional = true, default-features = false, features = [
    "jpeg",
] }

# --- Speech (`src/speech`) ---
#
# Not behind a feature. Speech links no engine at all — the synthesiser and
# the audio player are installed programs driven over a pipe — so there is
# nothing here for a build to opt out of, and a dependant that quietly
# disabled it would ship an application whose accessibility feature silently
# does nothing. That is the failure this crate's `default` policy already
# exists to prevent.
sha2 = { workspace = true }
# Voice and engine downloads. Rustls rather than a system TLS library, so
# fetching a voice does not become the second thing that can fail for want of
# an installed shared object.
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
# Engine archives. Pure-Rust backends throughout, for the same reason.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = "0.4"
zip = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
