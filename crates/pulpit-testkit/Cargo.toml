[package]
name = "pulpit-testkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The AcroForm hazard corpus, PDF builder and verification helpers for pulpit's tests. Development only."
# Never published and never linked into the binary: `SPEC-document.md` §5.1
# makes this a crate rather than a module precisely so it cannot ship.
publish = false

[dependencies]
tempfile = { workspace = true }

[[bin]]
name = "pulpit-dump-corpus"
path = "src/bin/dump-corpus.rs"
